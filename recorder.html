<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="normal" />
<title>Mobile View — recording preview</title>
<style>
  /* Extension-страница превью записи. Живёт под CSP расширения (не сайта), поэтому
     blob:-видео и перекодирование работают на любом сайте (GitHub и т.п.).
     Стили перенесены 1:1 из оверлея; :host(.light) → html.light. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Размеры СТРАНИЦЫ (px) — присылает content.js. Карточка считается от них, а НЕ от iframe:
     иначе при ужатии iframe под карточку vw/vh дали бы петлю сжатия. */
  :root { --pvw: 1280px; --pvh: 800px; } /* дефолт в px (НЕ vw/vh) — до rec-init, чтобы не было петли с размером iframe */
  /* План Б: затемнение рисует САМА страница (content.js, обычный div), а recorder-iframe ужат
     строго под карточку. Поэтому .shotprev больше не полноэкранная подложка, а обёртка размера карточки. */
  .shotprev { display: block; }
  .shotprev-card {
    background: #1f2430; color: #e8eaf0;
    border: 1px solid #3a4255; border-radius: 14px;
    width: min(560px, calc(var(--pvw) * 0.88)); max-height: calc(var(--pvh) * 0.92);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    animation: shotprev-pop .2s cubic-bezier(.4,0,.2,1);
  }
  .shotprev-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid #2c3342;
  }
  .shotprev-title { font-size: 14px; font-weight: 600; }
  .shotprev-x {
    border: 0; background: none; color: #8b93a7; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 6px;
  }
  .shotprev-x:hover { background: #2c3342; color: #fff; }
  .shotprev-imgwrap {
    padding: 14px; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#2a2f3a 0% 25%, #242a34 0% 50%) 50% / 22px 22px;
  }
  .shotprev-vid {
    max-width: 100%; max-height: calc(var(--pvh) * 0.58); display: block; cursor: pointer;
    border-radius: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.45); background: #000;
  }
  .shotprev-vid[hidden] { display: none; }
  .shotprev-vid::-webkit-media-controls-mute-button,
  .shotprev-vid::-webkit-media-controls-volume-control-container,
  .shotprev-vid::-webkit-media-controls-volume-slider { display: none !important; }
  .shotprev-actions {
    display: flex; gap: 10px; align-items: center; justify-content: flex-end;
    padding: 12px 14px; border-top: 1px solid #2c3342;
  }
  .shotprev-fmt, .shotprev-qual { position: relative; }
  .shotprev-fmt[hidden], .shotprev-qual[hidden] { display: none; }
  .shotprev-cancel { margin-left: auto; }
  .fmt-btn {
    display: flex; align-items: center; gap: 6px;
    background: #2c3342; color: #c7ccd8; border: 1px solid #3a4255;
    border-radius: 8px; padding: 8px 10px; font: 600 13px inherit; cursor: pointer;
  }
  .fmt-caret { font-size: 10px; opacity: .7; }
  .fmt-menu {
    position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 5;
    display: none; flex-direction: column; min-width: 130px;
    background: #232936; border: 1px solid #3a4255; border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); padding: 4px;
  }
  .shotprev-fmt.open .fmt-menu, .shotprev-qual.open .qual-menu { display: flex; }
  .fmt-opt {
    position: relative; display: flex; align-items: center; gap: 7px;
    background: none; border: 0; color: #e8eaf0; font: 600 13px inherit;
    text-align: left; padding: 8px 10px; border-radius: 7px; cursor: pointer;
  }
  .fmt-opt:hover { background: #2c3342; }
  .fmt-opt[hidden] { display: none; }
  .fmt-opt.sel { color: #8d86f5; }
  .qual-star { width: 13px; height: 13px; flex: none; display: block; fill: #fbbf24; }
  .qual-star[hidden] { display: none; }
  .qual-menu { min-width: 192px; }
  .qual-opt { gap: 8px; }
  .qual-name { white-space: nowrap; }
  .qual-sub { margin-left: auto; padding-left: 12px; color: #8b93a7; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .qual-free { margin-left: 0; padding-left: 0; color: #4ec98a; }
  .qual-badge {
    flex: none; padding: 1px 6px; border-radius: 5px;
    font: 700 10px/1.6 inherit; letter-spacing: .3px;
    color: #c9b4ff; background: rgba(141,134,245,.18); border: 1px solid rgba(141,134,245,.4);
  }
  .qual-cur-sub { font-size: 11px; font-weight: 700; opacity: .7; }
  html.light .qual-sub { color: #6b7280; }
  html.light .qual-free { color: #15803d; }
  html.light .qual-badge { color: #4f46e5; background: rgba(79,70,229,.1); border-color: rgba(79,70,229,.3); }
  .shotprev-note {
    display: flex; flex-direction: column; gap: 9px;
    margin: 12px 14px 14px; padding: 10px 12px; border-radius: 9px;
    background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.28);
    font: 400 12px/1.4 inherit; color: #e8eaf0;
  }
  .shotprev-note[hidden] { display: none; }
  .shotprev-note-main { display: flex; align-items: flex-start; gap: 8px; }
  .shotprev-note-ic { width: 16px; height: 16px; flex: none; color: #fbbf24; margin-top: 1px; }
  .shotprev-note-tx { color: #e3d6ad; }
  .shotprev-note-links { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 22px; padding-left: 24px; }
  .shotprev-note-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: #8d86f5; font-weight: 600; font-size: 12.5px; white-space: nowrap;
  }
  .shotprev-note-link:hover { color: #b3aef9; text-decoration: underline; }
  .shotprev-note-link svg { width: 14px; height: 14px; flex: none; }
  html.light .shotprev-note { background: rgba(245,158,11,.12); border-color: rgba(217,119,6,.35); }
  html.light .shotprev-note-tx { color: #8a6d1f; }
  html.light .shotprev-note-link { color: #4f46e5; }
  html.light .fmt-btn { background: #eef0f3; color: #374151; border-color: #d0d5dd; }
  html.light .fmt-menu { background: #ffffff; border-color: #d0d5dd; }
  html.light .fmt-opt { color: #1a1a2e; }
  html.light .fmt-opt:hover { background: #eef0f3; }
  html.light .fmt-opt.sel { color: #4f46e5; }
  .shotprev-edit { margin: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; }
  .shotprev-edit[hidden] { display: none; }
  .trim-row, .speed-row { display: flex; align-items: center; gap: 10px; }
  .edit-ic { width: 16px; height: 16px; flex: none; color: #8d86f5; }
  /* Свои контролы плеера ПОВЕРХ видео (нативную панель Chrome красить не даёт). */
  .pv-stage { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  .pv-ov {
    position: absolute; bottom: 10px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(15,18,26,.55); color: #fff; cursor: pointer;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: background .15s;
  }
  .pv-ov:hover { background: #4f46e5; }
  .pv-ov svg { display: block; }
  .pv-play { left: 10px; }
  .pv-full { right: 10px; }
  .pv-play svg { width: 22px; height: 22px; fill: currentColor; }
  .pv-play .pv-ic-pause { display: none; }
  .pv-play.playing .pv-ic-play { display: none; }
  .pv-play.playing .pv-ic-pause { display: block; }
  .pv-full svg { width: 18px; height: 18px; }
  /* Полный экран: разворачиваем контейнер, видео вписываем по центру. */
  .pv-stage:fullscreen, .pv-stage:-webkit-full-screen {
    width: 100vw; height: 100vh; max-width: none; line-height: 0;
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  .pv-stage:fullscreen .shotprev-vid, .pv-stage:-webkit-full-screen .shotprev-vid {
    max-width: 100vw; max-height: 100vh; border-radius: 0; box-shadow: none;
  }
  /* Полоса перемотки — только в полноэкранном (в обычном режиме перемотка по trim-дорожке). */
  .pv-seek {
    display: none; position: absolute; left: 64px; right: 64px; bottom: 26px; z-index: 2;
    height: 6px; border-radius: 3px; background: rgba(255,255,255,.28);
    cursor: pointer; touch-action: none;
  }
  .pv-seek-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: #6d65f0; }
  .pv-stage:fullscreen .pv-seek, .pv-stage:-webkit-full-screen .pv-seek { display: block; }
  .trim-track {
    position: relative; flex: 1; height: 26px; border-radius: 7px;
    background: #1c2230; border: 1px solid #2c3342; cursor: pointer; touch-action: none;
  }
  .trim-sel {
    position: absolute; top: 0; bottom: 0; pointer-events: none;
    background: rgba(109,101,240,.22); border: 1px solid #6d65f0; border-radius: 6px;
  }
  .trim-playhead {
    position: absolute; top: -2px; bottom: -2px; left: 0; width: 2px;
    background: #fff; border-radius: 2px; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,.6);
  }
  .trim-handle {
    position: absolute; top: 50%; left: 0; width: 14px; height: 30px;
    transform: translate(-50%, -50%); background: #6d65f0; border: 2px solid #fff;
    border-radius: 5px; cursor: ew-resize; box-shadow: 0 2px 6px rgba(0,0,0,.4); touch-action: none;
  }
  .trim-handle::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 12px;
    transform: translate(-50%, -50%);
    border-left: 1px solid rgba(255,255,255,.7); border-right: 1px solid rgba(255,255,255,.7);
  }
  .trim-handle:focus-visible { outline: 2px solid #b3aef9; outline-offset: 2px; }
  .trim-times {
    display: flex; align-items: center; justify-content: space-between;
    padding-left: 26px; font: 600 11.5px inherit; color: #9aa3b2;
  }
  .trim-cur { color: #c7ccd8; }
  .trim-len { color: #8d86f5; }
  .speed-seg {
    display: inline-flex; gap: 2px; padding: 2px;
    background: #1c2230; border: 1px solid #2c3342; border-radius: 8px;
  }
  .speed-opt {
    background: none; border: 0; color: #c7ccd8; font: 600 12.5px inherit;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .speed-opt:hover { background: #2c3342; }
  .speed-opt.sel { background: #4f46e5; color: #fff; }
  html.light .trim-track { background: #eef0f3; border-color: #d0d5dd; }
  html.light .trim-sel { background: rgba(79,70,229,.16); border-color: #4f46e5; }
  html.light .trim-handle { background: #4f46e5; }
  html.light .trim-playhead { background: #111; }
  html.light .trim-cur { color: #374151; }
  html.light .trim-len { color: #4f46e5; }
  html.light .speed-seg { background: #eef0f3; border-color: #d0d5dd; }
  html.light .speed-opt { color: #374151; }
  html.light .speed-opt:hover { background: #e2e6ea; }
  .shotprev-cancel, .shotprev-dl {
    border: 0; border-radius: 8px; padding: 9px 18px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .shotprev-cancel { background: #2c3342; color: #c7ccd8; }
  .shotprev-cancel:hover { background: #353d4f; }
  .shotprev-dl { background: #4f46e5; color: #fff; }
  .shotprev-dl:hover { background: #5a52ee; }
  @keyframes shotprev-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shotprev-pop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  html.light .shotprev-card { background: #fff; color: #1a1a2e; border-color: #d0d5dd; }
  html.light .shotprev-head, html.light .shotprev-actions { border-color: #e6e8ec; }
  html.light .shotprev-x { color: #6b7280; }
  html.light .shotprev-x:hover { background: #eef0f3; color: #111; }
  html.light .shotprev-imgwrap { background: repeating-conic-gradient(#e9ecf1 0% 25%, #f4f6f9 0% 50%) 50% / 22px 22px; }
  html.light .shotprev-cancel { background: #eef0f3; color: #374151; }
  html.light .shotprev-cancel:hover { background: #e2e6ea; }
  /* Свёрнутый режим: конвертация продолжается, показываем маленькую полосу прогресса. */
  .pv-mini { display: none; }
  html.mini .shotprev { display: none; }
  html.mini .pv-mini {
    position: fixed; inset: 0; display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 12px; box-sizing: border-box;
    background: #1f2430; color: #e8eaf0; border: 1px solid #3a4255; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html.light.mini .pv-mini { background: #fff; color: #1a1a2e; border-color: #d0d5dd; }
  .pv-mini-ic { width: 18px; height: 18px; flex: none; color: #8d86f5; }
  .pv-mini-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  html.light .pv-mini-bar { background: #eef0f3; }
  .pv-mini-fill { height: 100%; width: 0; background: #6d65f0; border-radius: 3px; transition: width .2s; }
  .pv-mini-tx { font-size: 12px; font-weight: 700; color: #8d86f5; min-width: 34px; text-align: right; }
  .pv-mini-x { border: 0; background: none; color: #8b93a7; cursor: pointer; font-size: 14px; line-height: 1; padding: 5px 6px; border-radius: 6px; flex: none; }
  .pv-mini-x:hover { background: #2c3342; color: #fff; }
  html.light .pv-mini-x:hover { background: #eef0f3; color: #111; }
</style>
</head>
<body>
  <div class="shotprev" id="root" role="dialog" aria-modal="true">
    <div class="shotprev-card">
      <div class="shotprev-head">
        <span class="shotprev-title"></span>
        <button class="shotprev-x" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="shotprev-imgwrap">
        <div class="pv-stage">
          <video class="shotprev-vid" playsinline disablepictureinpicture></video>
          <button class="pv-ov pv-play" type="button" aria-label="Play/Pause">
            <svg class="pv-ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pv-ic-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
          <button class="pv-ov pv-full" type="button" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <div class="pv-seek"><div class="pv-seek-fill"></div></div>
        </div>
      </div>
      <div class="shotprev-edit" hidden>
        <div class="trim-row">
          <svg class="edit-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
          <div class="trim-track">
            <div class="trim-sel"></div>
            <div class="trim-playhead"></div>
            <div class="trim-handle trim-a" tabindex="0" role="slider" aria-label="Start"></div>
            <div class="trim-handle trim-b" tabindex="0" role="slider" aria-label="End"></div>
          </div>
        </div>
        <div class="trim-times">
          <span class="trim-cur">0:00.0</span>
          <span class="trim-range"><span class="trim-ta">0:00.0</span> – <span class="trim-tb">0:00.0</span> · <span class="trim-len">0:00.0</span></span>
        </div>
        <div class="speed-row">
          <svg class="edit-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 17.5a8 8 0 1 1 15 0"/><line x1="12" y1="17.5" x2="15.6" y2="12.4"/><circle cx="12" cy="17.5" r="1.4" fill="currentColor" stroke="none"/></svg>
          <div class="speed-seg">
            <button class="speed-opt sel" data-s="1" type="button">1×</button>
            <button class="speed-opt" data-s="1.5" type="button">1.5×</button>
            <button class="speed-opt" data-s="2" type="button">2×</button>
          </div>
        </div>
      </div>
      <div class="shotprev-actions">
        <div class="shotprev-fmt" hidden>
          <button class="fmt-btn" type="button" aria-haspopup="true">
            <span class="fmt-cur">WebM</span><span class="fmt-caret">▾</span>
          </button>
          <div class="fmt-menu">
            <button class="fmt-opt" data-fmt="webm" type="button">WebM</button>
            <button class="fmt-opt" data-fmt="mp4" type="button">MP4</button>
          </div>
        </div>
        <div class="shotprev-qual" hidden>
          <button class="qual-btn fmt-btn" type="button" aria-haspopup="true">
            <svg class="qual-star qual-cur-star" viewBox="0 0 24 24" hidden><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            <span class="qual-cur"></span><span class="qual-cur-sub"></span><span class="fmt-caret">▾</span>
          </button>
          <div class="fmt-menu qual-menu">
            <button class="fmt-opt qual-opt qual-native" data-h="0" type="button">
              <svg class="qual-star" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              <span class="qual-name qual-name-best"></span>
              <span class="qual-badge qual-native-badge"></span>
              <span class="qual-sub qual-free"></span>
            </button>
            <button class="fmt-opt qual-opt" data-h="1080" type="button"><span class="qual-name qual-name-high"></span><span class="qual-sub">1080p</span></button>
            <button class="fmt-opt qual-opt" data-h="720" type="button"><span class="qual-name qual-name-mid"></span><span class="qual-sub">720p</span></button>
            <button class="fmt-opt qual-opt" data-h="480" type="button"><span class="qual-name qual-name-low"></span><span class="qual-sub">480p</span></button>
          </div>
        </div>
        <button class="shotprev-cancel"></button>
        <button class="shotprev-dl"></button>
      </div>
    </div>
  </div>
  <div class="pv-mini">
    <svg class="pv-mini-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <div class="pv-mini-bar"><div class="pv-mini-fill"></div></div>
    <span class="pv-mini-tx">0%</span>
    <button class="pv-mini-x" type="button" aria-label="Close">✕</button>
  </div>
  <script src="vendor/mp4-muxer.js"></script>
  <script src="vendor/webm-muxer.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
